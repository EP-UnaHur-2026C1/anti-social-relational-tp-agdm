openapi: 3.0.0
info:
  title: UnaHur Anti-Social Net API - AGDM
  description: API REST para la red social Anti-Social Net.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local

tags:
  - name: Users
    description: Gestión de usuarios
  - name: Followers
    description: Gestión de seguidores
  - name: Posts
    description: Gestión de publicaciones
  - name: Comments
    description: Gestión de comentarios
  - name: Tags
    description: Gestión de etiquetas
  - name: Images
    description: Gestión de imágenes de posts

paths:
  # ── USERS ──────────────────────────────────

  /users:
    get:
      tags: [Users]
      summary: Obtener todos los usuarios
      responses:
        "200":
          description: Lista de usuarios con nickName y email
        "500":
          description: Error interno del servidor

    post:
      tags: [Users]
      summary: Crear usuario
      description: nickName es PK y único. Email único. Password mínimo 6 caracteres.
      requestBody:
        required: true
        content:
          application/json:
            example:
              nickName: juanito99
              email: juan@mail.com
              password: password123
      responses:
        "201":
          description: Usuario creado correctamente
        "400":
          description: |
            Error de validación. Posibles causas:
            - nickName menor a 3 caracteres o mayor a 30
            - Email con formato inválido
            - Password menor a 6 caracteres
            - nickName o email ya en uso
        "500":
          description: Error interno del servidor

  /users/{nickName}:
    get:
      tags: [Users]
      summary: Obtener usuario por nickName
      description: Retorna el usuario con sus listas Followers y Following
      parameters:
        - name: nickName
          in: path
          required: true
          schema:
            type: string
          example: juanito99
      responses:
        "200":
          description: Usuario encontrado con Followers y Following
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno del servidor

    put:
      tags: [Users]
      summary: Actualizar usuario
      description: Actualiza email y/o password. Se debe enviar al menos un campo. El nickName no se puede modificar.
      parameters:
        - name: nickName
          in: path
          required: true
          schema:
            type: string
          example: juanito99
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: nuevo@mail.com
              password: nuevaPass123
      responses:
        "200":
          description: Usuario actualizado. Retorna nickName y email.
        "400":
          description: Error de validación o email ya en uso
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno del servidor

    delete:
      tags: [Users]
      summary: Eliminar usuario
      parameters:
        - name: nickName
          in: path
          required: true
          schema:
            type: string
          example: juanito99
      responses:
        "200":
          description: Usuario eliminado correctamente
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno del servidor

  # ── FOLLOWERS ──────────────────────────────

  /users/{seguidorNick}/follow:
    post:
      tags: [Followers]
      summary: Seguir a un usuario
      description: seguidorNick (URL) sigue al usuario indicado en el body. No se puede seguir a uno mismo.
      parameters:
        - name: seguidorNick
          in: path
          required: true
          schema:
            type: string
          example: juanito99
      requestBody:
        required: true
        content:
          application/json:
            example:
              seguir: maria_gomez
      responses:
        "200":
          description: Ahora sigue al usuario
        "400":
          description: No podés seguirte a vos mismo o campo faltante
        "404":
          description: Uno o ambos usuarios no existen
        "409":
          description: Ya seguís a este usuario
        "500":
          description: Error interno del servidor

  /users/{seguidorNick}/unfollow:
    delete:
      tags: [Followers]
      summary: Dejar de seguir a un usuario
      parameters:
        - name: seguidorNick
          in: path
          required: true
          schema:
            type: string
          example: juanito99
      requestBody:
        required: true
        content:
          application/json:
            example:
              seguir: maria_gomez
      responses:
        "200":
          description: Dejó de seguir al usuario
        "400":
          description: No lo seguías o campo faltante
        "404":
          description: Uno o ambos usuarios no existen
        "500":
          description: Error interno del servidor

  # ── POSTS ───────────────────────────────────

  /post:
    get:
      tags: [Posts]
      summary: Obtener todos los posts
      description: Retorna todos los posts con author, comments, images y tags
      responses:
        "200":
          description: Lista de posts
        "500":
          description: Error interno del servidor

  /post/users/{nickName}:
    post:
      tags: [Posts]
      summary: Crear post
      description: |
        Crea un post asociado al usuario.
        Tags deben comenzar con # y sin espacios (ej: #tecnologia).
        Images deben ser URLs válidas. Ambos arrays pueden estar vacíos.
      parameters:
        - name: nickName
          in: path
          required: true
          schema:
            type: string
          example: juanito99
      requestBody:
        required: true
        content:
          application/json:
            example:
              description: Mi primer post en Anti-Social Net!
              tags: ["#tecnologia", "#unahur"]
              images: ["https://picsum.photos/400/300"]
      responses:
        "201":
          description: Post creado correctamente
        "400":
          description: Error de validación (description vacía, tag sin #, URL inválida)
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno del servidor

  /post/user/{nickName}:
    get:
      tags: [Posts]
      summary: Obtener posts de un usuario
      description: Retorna los posts del usuario ordenados por fecha DESC con images y tags
      parameters:
        - name: nickName
          in: path
          required: true
          schema:
            type: string
          example: juanito99
      responses:
        "200":
          description: Lista de posts del usuario
        "404":
          description: Usuario no encontrado
        "500":
          description: Error interno del servidor

  /post/{id}:
    get:
      tags: [Posts]
      summary: Obtener post por ID
      description: Retorna el post con author, comments, images y tags
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Post encontrado
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor

    put:
      tags: [Posts]
      summary: Actualizar post
      description: Reemplaza description, tags e images. Las imágenes anteriores se eliminan.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            example:
              description: Descripción actualizada
              tags: ["#actualizado"]
              images: ["https://picsum.photos/400/300"]
      responses:
        "200":
          description: Post actualizado correctamente
        "400":
          description: Error de validación
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor

    delete:
      tags: [Posts]
      summary: Eliminar post
      description: Elimina el post y todas sus imágenes asociadas
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Post eliminado correctamente
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor

  # ── COMMENTS ───────────────────────────────

  /comments:
    post:
      tags: [Comments]
      summary: Crear comentario
      description: |
        Crea un comentario sobre un post. Se crea con visible true.
        El post y el usuario deben existir.
      requestBody:
        required: true
        content:
          application/json:
            example:
              contenido: Excelente post!
              postId: 1
              userNickname: maria_gomez
      responses:
        "201":
          description: Comentario creado correctamente
        "400":
          description: Error de validación (contenido vacío, postId o userNickname faltante)
        "404":
          description: Post o usuario no encontrado
        "500":
          description: Error interno del servidor

  /comments/post/{postId}:
    get:
      tags: [Comments]
      summary: Obtener comentarios de un post
      description: |
        Retorna los comentarios visibles del post no más antiguos que
        MESES_VISIBILIDAD del .env (default 6 meses).
        Si el post no tiene comentarios retorna 400.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Lista de comentarios visibles y dentro del rango de meses
        "400":
          description: El post no tiene comentarios
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor

  /comments/{id}:
    put:
      tags: [Comments]
      summary: Actualizar comentario
      description: Actualiza el contenido de un comentario por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            example:
              contenido: Comentario editado
      responses:
        "200":
          description: Comentario actualizado correctamente
        "400":
          description: Error de validación
        "404":
          description: Comentario no encontrado
        "500":
          description: Error interno del servidor

    delete:
      tags: [Comments]
      summary: Eliminar comentario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Comentario eliminado correctamente
        "404":
          description: Comentario no encontrado
        "500":
          description: Error interno del servidor

  # ── TAGS ────────────────────────────────────

  /tags:
    get:
      tags: [Tags]
      summary: Obtener todos los tags
      responses:
        "200":
          description: Lista de todos los tags con su nombre
        "500":
          description: Error interno del servidor

  /tags/post/{id}:
    get:
      tags: [Tags]
      summary: Obtener tags de un post
      description: Retorna los nombres de los tags asociados a un post específico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Lista de nombres de tags del post
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor

  /tags/{id}:
    delete:
      tags: [Tags]
      summary: Eliminar tag
      description: Elimina un tag por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Tag eliminado correctamente
        "404":
          description: Tag no encontrado
        "500":
          description: Error interno del servidor

  # ── IMAGES ──────────────────────────────────

  /image:
    get:
      tags: [Images]
      summary: Obtener todas las imágenes
      description: Retorna todas las imágenes con id, url y postId
      responses:
        "200":
          description: Lista de todas las imágenes
        "500":
          description: Error interno del servidor

  /image/post/{id}:
    get:
      tags: [Images]
      summary: Obtener imágenes de un post
      description: Retorna todas las imágenes asociadas a un post específico
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Lista de imágenes del post con id y url
        "404":
          description: Post no encontrado
        "500":
          description: Error interno del servidor

  /image/{id}:
    delete:
      tags: [Images]
      summary: Eliminar imagen
      description: Elimina una imagen por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Imagen eliminada correctamente
        "404":
          description: Imagen no encontrada
        "500":
          description: Error interno del servidor
